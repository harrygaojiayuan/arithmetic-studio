name: Test, build and release desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check

  windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - name: Build installer and portable ZIP
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Start packaged app and verify Windows runtime
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'release/win-unpacked/ArithmeticStudio.exe').Path
          $data = Join-Path $env:RUNNER_TEMP 'ArithmeticStudio-smoke-data'
          $report = Join-Path $env:RUNNER_TEMP 'ArithmeticStudio-smoke.json'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', "--smoke-data-dir=$data", "--smoke-report=$report") -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Packaged app timed out during Windows smoke tests.'
          }
          if (-not (Test-Path $report)) { throw 'Packaged app did not produce a smoke-test report.' }
          Get-Content $report
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or -not $result.ok) { throw 'Windows smoke tests failed.' }
          Copy-Item $report 'release/Windows-smoke-test.json'
      - name: Compute download checksums
        run: node scripts/checksums.mjs release
      - uses: actions/upload-artifact@v7
        with:
          name: ArithmeticStudio-Windows-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/*.zip
            release/SHA256SUMS.txt
            release/Windows-smoke-test.json
          if-no-files-found: error
          retention-days: 30

  macos:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build and verify universal Mac downloads
        run: python3 native/package_macos.py
      - name: Sign Mac update manifest
        id: sign
        env:
          MACOS_UPDATE_PRIVATE_KEY: ${{ secrets.MACOS_UPDATE_PRIVATE_KEY }}
        run: |
          if [ -n "$MACOS_UPDATE_PRIVATE_KEY" ]; then
            node scripts/make-macos-appcast.mjs
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Archive verified. Sign appcast locally before publishing this release.'
            echo 'signed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ArithmeticStudio-macOS-universal
          path: |
            release/*-macos-universal.dmg
            release/*-macos-universal.zip
            release/SHA256SUMS-macos.txt
            release/Mac-build-verification.json
            release/Mac-update-verification.json
            release/appcast.xml
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') && needs.macos.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: ArithmeticStudio-*
          path: release
          merge-multiple: true
      - name: Publish verified downloads and update metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$TAG" = "v$(node -p "require('./package.json').version")"
          test -f release/latest.yml
          test -f release/appcast.xml
          assets=(release/*.exe release/*.exe.blockmap release/*.zip release/*.dmg release/SHA256SUMS*.txt release/*verification.json release/Windows-smoke-test.json release/latest.yml release/appcast.xml)
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GH_REPO"
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --draft --title "算数练习室 $TAG · Windows + macOS" --notes-file docs/RELEASE_NOTES.md --repo "$GH_REPO"
          fi
          gh release edit "$TAG" --draft=false --latest --repo "$GH_REPO"
